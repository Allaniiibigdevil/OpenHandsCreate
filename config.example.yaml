# 客服机器人配置文件
# 复制此文件为 config.yaml 并填入实际配置

# DeepSeek API 配置
deepseek:
  api_key: "your-deepseek-api-key-here"
  api_base: "https://api.deepseek.com/v1"
  model: "deepseek-chat"
  max_tokens: 2000
  temperature: 0.7

# 知识库配置
knowledge_base:
  # 知识库文件路径
  data_path: "data/knowledge_base.json"
  # 相似度匹配阈值 (0-1)
  similarity_threshold: 0.6
  # 最大返回结果数
  max_results: 3

# 对话配置
conversation:
  # 系统提示词
  system_prompt: "你是一个专业的客服机器人，负责回答用户问题。请基于提供的知识库信息回答，如果知识库中没有相关信息，请礼貌地告知用户。"
  # 对话历史保留条数
  max_history: 10
  # 是否启用知识库增强
  enable_knowledge_base: true

# 日志配置
logging:
  level: "INFO"
  file: "logs/chatbot.log"
